<div class="flex flex-wrap items-center justify-center gap-space-sm">
  {%- if site.social.github != "" %}
  <a class="px-space-md py-1.5 rounded-full comic-border bg-surface-container-lowest text-on-surface font-label-md text-label-md comic-shadow-sm hover:comic-shadow-md hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all flex items-center gap-space-xs" href="{{ site.social.github }}" target="_blank" rel="noopener"><span class="material-symbols-outlined text-[18px]">terminal</span><span>GitHub</span></a>
  {%- endif %}
  {%- if site.social.twitter != "" %}
  <a class="px-space-md py-1.5 rounded-full comic-border bg-tertiary-container text-on-surface font-label-md text-label-md comic-shadow-sm hover:comic-shadow-md hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all flex items-center gap-space-xs" href="{{ site.social.twitter }}" target="_blank" rel="noopener"><span class="material-symbols-outlined text-[18px]">chat</span><span>Twitter/X</span></a>
  {%- endif %}
  {%- if site.social.linkedin != "" %}
  <a class="px-space-md py-1.5 rounded-full comic-border bg-secondary-container text-on-surface font-label-md text-label-md comic-shadow-sm hover:comic-shadow-md hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all flex items-center gap-space-xs" href="{{ site.social.linkedin }}" target="_blank" rel="noopener"><span class="material-symbols-outlined text-[18px]">badge</span><span>LinkedIn</span></a>
  {%- endif %}
  <a class="px-space-md py-1.5 rounded-full comic-border bg-primary-container text-on-surface font-label-md text-label-md comic-shadow-sm hover:comic-shadow-md hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all flex items-center gap-space-xs" href="{{ '/feed.xml' | relative_url }}"><span class="material-symbols-outlined text-[18px]">rss_feed</span><span>RSS</span></a>
  {%- if site.social.discord != "" %}
  <a class="px-space-md py-1.5 rounded-full comic-border bg-surface-variant text-on-surface font-label-md text-label-md comic-shadow-sm hover:comic-shadow-md hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all flex items-center gap-space-xs" href="{{ site.social.discord }}" target="_blank" rel="noopener"><span class="material-symbols-outlined text-[18px]">forum</span><span>Discord</span></a>
  {%- endif %}
</div>
