{%- assign p = include.post -%}
<article class="rounded-2xl comic-border bg-surface-container-lowest p-space-lg comic-shadow-md hover:comic-shadow-lg transition-all flex flex-col justify-between group h-full">
  <div class="flex flex-col gap-space-md">
    <div class="flex items-center justify-between">
      <span class="px-space-sm py-0.5 rounded-full comic-border text-on-surface font-label-sm text-label-sm comic-shadow-sm" style="background: {% include category-color.html category=p.category %}">{{ p.category | default: "Notes" }}</span>
      <span class="px-space-sm py-0.5 rounded-full comic-border bg-primary-container font-label-sm text-label-sm">★ Latest</span>
    </div>
    <a class="flex flex-col gap-space-xs" href="{{ p.url | relative_url }}">
      <h3 class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">{{ p.title }}</h3>
      <p class="font-body-md text-body-md text-on-surface-variant line-clamp-3">{{ p.description | default: p.excerpt | strip_html | strip }}</p>
    </a>
  </div>
  <div class="pt-space-md border-t-[2.5px] border-[#18181b] mt-space-md flex flex-wrap items-center justify-between gap-space-sm font-label-md text-label-md text-on-surface-variant">
    <div class="flex items-center gap-space-sm flex-wrap">
      <span>📅 {{ p.date | date: "%b %-d, %Y" }}</span>
      <span>•</span>
      <span>⏱️ {% include reading-time.html content=p.content %} min read</span>
    </div>
    <a class="font-headline-sm text-on-surface inline-flex items-center gap-1 group-hover:underline" href="{{ p.url | relative_url }}">Read Story →</a>
  </div>
</article>
